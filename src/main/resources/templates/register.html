<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="layout/offline">
<head>
    <meta charset="utf-8"/>
    <title>Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" />
    <style>
        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 10px auto;
            display: block;
        }
        .avatar-upload {
            text-align: center;
            margin: 20px 0;
        }
        .avatar-upload input[type="file"] {
            display: none;
        }
        .avatar-upload label {
            cursor: pointer;
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            border-radius: 4px;
            display: inline-block;
        }
        .avatar-upload label:hover {
            background-color: #1976D2;
        }
        #avatarPreview {
            border: 2px solid #ddd;
            transition: border-color 0.3s ease;
        }
        #avatarPreview:hover {
            border-color: #2196F3;
        }
        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .cropper-container {
            max-width: 100%;
            max-height: 400px;
            margin: 20px auto;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            position: relative;
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            border-radius: 5px;
        }
        .close {
            position: absolute;
            right: 20px;
            top: 10px;
            font-size: 28px;
            cursor: pointer;
        }
        .cropper-buttons {
            text-align: center;
            margin-top: 20px;
        }
        .cropper-buttons button {
            margin: 0 10px;
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-crop {
            background-color: #2196F3;
            color: white;
        }
        .btn-cancel {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <main layout:fragment="content">
        <article class="container" style="padding-top: 3%;">
            <header class="row">
                <div class="col s12">
                    <h3 class="center">注册</h3>
                    <h5 class="center">Sign up</h5>
                </div>
            </header>
            <section>
                <form th:action="@{/register}" method="post" enctype="multipart/form-data" id="registerForm">
                    <div class="row">
                        <div class="col s12">
                            <label> 用户名:
                                <input type="text" name="username" id="username" minlength="3" maxlength="10" data-length="10" required="required"/>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col s12">
                            <label> 密码:
                                <input type="password" name="password" minlength="6" maxlength="10" data-length="10" required="required"/>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col s12">
                            <label> 邮箱:
                                <input type="email" name="email" required="required"/>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col s12">
                            <label> 简介:
                                <input type="text" name="introduction" maxlength="16" data-length="16" placeholder="[optional]"/>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col s12">
                            <div class="avatar-upload">
                                <img id="avatarPreview" th:src="@{/images/default-avatar.png}" class="avatar-preview" alt="头像预览" />
                                <input type="file" id="avatar" name="avatar" accept="image/*"/>
                                <label for="avatar">选择头像</label>
                                <div id="avatarError" class="error-message"></div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col s12 center">
                            <p class="center">In case of the success, you will be redirected to login page</p>
                            <p class="center">Otherwise change your username</p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col s12 center">
                            <button class="btn waves-effect waves-light btn-large" type="submit" name="register">注册</button>
                        </div>
                    </div>
                </form>
            </section>
        </article>
    </main>

    <!-- 裁切模态框 -->
    <div id="cropperModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="cropper-container">
                <img id="cropperImage" src="" alt="待裁切图片" />
            </div>
            <div class="cropper-buttons">
                <button class="btn-crop" id="cropButton">裁切并确认</button>
                <button class="btn-cancel" id="cancelButton">取消</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script th:inline="javascript">
        //<![CDATA[
        document.addEventListener('DOMContentLoaded', function() {
            // 获取所有需要的DOM元素
            var avatarInput = document.getElementById('avatar');
            var avatarPreview = document.getElementById('avatarPreview');
            var avatarError = document.getElementById('avatarError');
            var cropperModal = document.getElementById('cropperModal');
            var cropperImage = document.getElementById('cropperImage');
            var cropButton = document.getElementById('cropButton');
            var cancelButton = document.getElementById('cancelButton');
            var closeButton = document.querySelector('.close');
            var uploadLabel = document.querySelector('label[for="avatar"]');

            var cropper = null;
            var croppedBlob = null;

            // 验证文件函数
            function validateFile(file) {
                var validTypes = ['image/jpeg', 'image/png', 'image/gif'];
                var maxSize = 5 * 1024 * 1024; // 5MB

                if (!validTypes.includes(file.type)) {
                    avatarError.textContent = '请选择有效的图片文件（JPG、PNG或GIF）';
                    avatarError.style.display = 'block';
                    return false;
                }

                if (file.size > maxSize) {
                    avatarError.textContent = '图片大小不能超过5MB';
                    avatarError.style.display = 'block';
                    return false;
                }

                avatarError.style.display = 'none';
                return true;
            }

            // 显示裁切模态框
            function showCropperModal() {
                cropperModal.style.display = 'block';
            }

            // 隐藏裁切模态框
            function hideCropperModal() {
                cropperModal.style.display = 'none';
                if (cropper) {
                    cropper.destroy();
                    cropper = null;
                }
            }

            // 初始化裁切器
            function initCropper(imageUrl) {
                // 确保图片加载完成后再初始化 Cropper
                var img = new Image();
                img.onload = function() {
                    cropperImage.src = imageUrl;
                    if (cropper) {
                        cropper.destroy();
                    }
                    cropper = new Cropper(cropperImage, {
                        aspectRatio: 1,
                        viewMode: 1,
                        dragMode: 'move',
                        autoCropArea: 1,
                        restore: false,
                        guides: true,
                        center: true,
                        highlight: false,
                        cropBoxMovable: true,
                        cropBoxResizable: true,
                        toggleDragModeOnDblclick: true,
                        minContainerWidth: 300,
                        minContainerHeight: 300,
                        background: true,
                        responsive: true,
                        autoCropWidth: 200,
                        autoCropHeight: 200
                    });
                };
                img.onerror = function() {
                    alert('图片加载失败，请重试');
                    hideCropperModal();
                    avatarInput.value = '';
                };
                img.src = imageUrl;
            }

            // 裁切图片
            function cropImage() {
                if (!cropper) return;

                var canvas = cropper.getCroppedCanvas({
                    width: 200,
                    height: 200
                });

                canvas.toBlob(function(blob) {
                    if (!blob) {
                        alert('图片处理失败，请重试');
                        return;
                    }

                    croppedBlob = blob;
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        // 立即更新预览图片
                        avatarPreview.src = e.target.result;
                        // 保存到本地存储
                        try {
                            localStorage.setItem('avatarPreview', e.target.result);
                            console.log('头像已保存到本地存储');
                        } catch (error) {
                            console.error('保存头像到本地存储失败:', error);
                        }
                    }
                    reader.onerror = function() {
                        alert('图片读取失败，请重试');
                    }
                    reader.readAsDataURL(blob);
                }, 'image/png', 0.8);

                hideCropperModal();
            }

            // 处理文件选择
            function handleFileSelect(file) {
                if (validateFile(file)) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        // 先显示预览
                        avatarPreview.src = e.target.result;
                        // 然后显示裁切模态框
                        showCropperModal();
                        initCropper(e.target.result);
                    }
                    reader.onerror = function() {
                        alert('图片读取失败，请重试');
                        avatarInput.value = '';
                    }
                    reader.readAsDataURL(file);
                } else {
                    avatarInput.value = '';
                }
            }

            // 绑定文件选择事件
            if (avatarInput) {
                // 监听文件输入框变化
                avatarInput.addEventListener('change', function(e) {
                    if (this.files && this.files[0]) {
                        handleFileSelect(this.files[0]);
                    }
                });

                // 监听标签点击事件
                if (uploadLabel) {
                    uploadLabel.addEventListener('click', function(e) {
                        e.preventDefault();
                        avatarInput.click();
                    });
                }
            }

            // 绑定裁切相关事件
            cropButton.addEventListener('click', cropImage);
            cancelButton.addEventListener('click', function() {
                hideCropperModal();
                // 如果取消裁切，恢复默认头像
                avatarPreview.src = '/images/default-avatar.png';
                avatarInput.value = '';
            });
            closeButton.addEventListener('click', function() {
                hideCropperModal();
                // 如果关闭模态框，恢复默认头像
                avatarPreview.src = '/images/default-avatar.png';
                avatarInput.value = '';
            });

            // 从本地存储恢复预览图片
            try {
                var savedPreview = localStorage.getItem('avatarPreview');
                if (savedPreview) {
                    var img = new Image();
                    img.onload = function() {
                        avatarPreview.src = savedPreview;
                        console.log('已从本地存储恢复头像');
                    };
                    img.onerror = function() {
                        console.error('从本地存储恢复的头像加载失败');
                        localStorage.removeItem('avatarPreview');
                    };
                    img.src = savedPreview;
                }
            } catch (error) {
                console.error('从本地存储恢复头像失败:', error);
            }

            // 表单提交处理
            document.getElementById('registerForm').addEventListener('submit', function(e) {
                e.preventDefault();

                var formData = new FormData(this);

                if (croppedBlob) {
                    var file = new File([croppedBlob], 'avatar.png', { type: 'image/png' });
                    formData.set('avatar', file);
                    console.log('准备上传头像文件');
                }

                fetch(this.action, {
                    method: 'POST',
                    body: formData,
                    credentials: 'same-origin'
                })
                .then(function(response) {
                    if (response.ok) {
                        try {
                            localStorage.removeItem('avatarPreview');
                            console.log('注册成功，已清除本地存储的头像');
                        } catch (error) {
                            console.error('清除本地存储失败:', error);
                        }
                        window.location.href = '/login';
                    } else {
                        return response.text().then(function(text) {
                            throw new Error(text || '注册失败，请重试');
                        });
                    }
                })
                .catch(function(error) {
                    console.error('Error:', error);
                    alert(error.message || '注册失败，请重试');
                });
            });

            // 全局错误处理
            window.onerror = function(msg, url, lineNo, columnNo, error) {
                console.error('Error: ' + msg + '\nURL: ' + url + '\nLine: ' + lineNo + '\nColumn: ' + columnNo + '\nError object: ' + JSON.stringify(error));
                return false;
            };
        });
        //]]>
    </script>
</body>
</html>
