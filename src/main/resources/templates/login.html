<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="layout/offline">
<head>
    <title>Login</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/css/materialize.min.css" rel="stylesheet" type="text/css"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <style>
        .error-text {
            color: #f44336;
            font-size: 0.8em;
            margin-top: 5px;
        }
        .modal {
            max-width: 500px;
        }
    </style>
</head>
<body>
    <main layout:fragment="content">
        <article class="container" style="padding-top: 3%;">
            <header class="row">
                <div class="col s12">
                    <h3 class="center">登录</h3>
                    <h5 class="center">Sign in</h5>
                    <div th:if="${param.error}" class="error-text">
                        <div th:unless="${session.SPRING_SECURITY_LAST_EXCEPTION?.message != null}">
                            <div th:if="${param.error == 'invalid_credentials'}">用户名或密码错误</div>
                            <div th:unless="${param.error == 'invalid_credentials'}">登录失败，请重试</div>
                        </div>
                    </div>
                </div>
            </header>
            <section>
                <form th:action="@{/login}" method="post">
                    <div class="row">
                        <div class="col s12">
                            <label> 用户名:
                                <input type="text" name="username" maxlength="10" data-length="10" required="required"/>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col s12">
                            <label> 密码:
                                <input type="password" name="password" maxlength="10" data-length="10" required="required"/>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col s12 center">
                            <button class="btn waves-effect waves-light btn-large" type="submit" name="login">登录</button>
                        </div>
                    </div>
                    <!-- 这一句主要防止CSRF攻击 -->
                    <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                </form>
            </section>
        </article>
    </main>

    <!-- 封禁信息弹窗 -->
    <div th:if="${session.SPRING_SECURITY_LAST_EXCEPTION?.message != null}" id="banModal" class="modal">
        <div class="modal-content">
            <h4>账号状态异常</h4>
            <p th:text="${session.SPRING_SECURITY_LAST_EXCEPTION?.message}"></p>
        </div>
        <div class="modal-footer">
            <a href="#!" class="modal-action modal-close waves-effect waves-green btn-flat">确定</a>
        </div>
    </div>

    <script type="text/javascript" src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/js/materialize.min.js"></script>
    <script>
        $(document).ready(function(){
            // 初始化所有模态框
            $('.modal').modal();

            // 如果有封禁信息，自动打开弹窗
            var banModal = $('#banModal');
            if (banModal.length > 0) {
                banModal.modal('open');
            }
        });
    </script>
</body>
</html>
