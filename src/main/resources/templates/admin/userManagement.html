<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="layout/online">
<head>
<title>用户管理</title>
<meta charset="UTF-8"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
//<![CDATA[
// 全局变量
let banModal;
let sectionModal;
let currentUserId = null;
let currentUserRole = null;
let lastFocusedElement = null;

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
	// 初始化模态框
	banModal = new bootstrap.Modal(document.getElementById('banModal'), {
		backdrop: 'static',
		keyboard: false
	});
	sectionModal = new bootstrap.Modal(document.getElementById('sectionModal'), {
		backdrop: 'static',
		keyboard: false
	});

	// 为模态框添加事件监听器
	document.getElementById('banModal').addEventListener('show.bs.modal', function() {
		lastFocusedElement = document.activeElement;
		// 将焦点设置到第一个可聚焦元素
		const firstFocusable = this.querySelector('input, button, [tabindex]:not([tabindex="-1"])');
		if (firstFocusable) {
			firstFocusable.focus();
		}
	});

	document.getElementById('banModal').addEventListener('hide.bs.modal', function() {
		if (lastFocusedElement) {
			lastFocusedElement.focus();
		}
	});

	document.getElementById('sectionModal').addEventListener('show.bs.modal', function() {
		lastFocusedElement = document.activeElement;
		// 将焦点设置到第一个可聚焦元素
		const firstFocusable = this.querySelector('input, button, [tabindex]:not([tabindex="-1"])');
		if (firstFocusable) {
			firstFocusable.focus();
		}
	});

	document.getElementById('sectionModal').addEventListener('hide.bs.modal', function() {
		if (lastFocusedElement) {
			lastFocusedElement.focus();
		}
	});

	// 为所有角色选择框添加原始值属性
	document.querySelectorAll('select[data-user-id]').forEach(select => {
		select.setAttribute('data-original-value', select.value);
		select.addEventListener('change', function() {
			updateUserRole(this);
		});
	});

	document.querySelectorAll('button[data-action="ban"]').forEach(button => {
		button.addEventListener('click', function(e) {
			e.preventDefault();
			showBanModal(this);
		});
	});

	document.querySelectorAll('button[data-action="unban"]').forEach(button => {
		button.addEventListener('click', function(e) {
			e.preventDefault();
			unbanUser(this);
		});
	});

	document.querySelectorAll('button[data-action="delete"]').forEach(button => {
		button.addEventListener('click', function(e) {
			e.preventDefault();
			deleteUser(this);
		});
	});
});

// 函数定义
function showBanModal(button) {
	const row = button.closest('tr');
	const userId = row.querySelector('td:first-child').textContent;
	if (!userId) {
		alert('无法获取用户ID，请刷新页面重试');
		return;
	}
	currentUserId = userId;
	document.getElementById('banDuration').value = '7';
	document.getElementById('banReason').value = '';
	banModal.show();
}

function confirmBan() {
	if (!currentUserId) {
		alert('无法获取用户ID，请刷新页面重试');
		return;
	}

	const duration = document.getElementById('banDuration').value;
	const reason = document.getElementById('banReason').value;

	if (!reason) {
		alert('请输入封禁原因');
		return;
	}

	const now = new Date();
	let endTime;

	if (duration === '0') {
		endTime = 0;
	} else {
		const endDate = new Date(now);
		endDate.setDate(endDate.getDate() + parseInt(duration));
		endTime = endDate.getTime();
	}

	const confirmMessage = '确定要封禁该用户吗？\n封禁时长：' +
		(duration === '0' ? '永久' : duration + '天') +
		'\n封禁原因：' + reason;

	if (!confirm(confirmMessage)) {
		return;
	}

	const formData = new URLSearchParams();
	formData.append('endTime', endTime);
	formData.append('reason', reason);

	fetch('/admin/users/' + encodeURIComponent(currentUserId) + '/ban', {
		method: 'POST',
		headers: {
			'Content-Type': 'application/x-www-form-urlencoded',
		},
		body: formData.toString()
	})
	.then(response => {
		if (!response.ok) {
			throw new Error('网络请求失败');
		}
		return response.text();
	})
	.then(result => {
		alert(result);
		if (result === '用户已封禁') {
			location.reload();
		}
	})
	.catch(error => {
		console.error('Error:', error);
		alert('操作失败，请重试');
	});

	banModal.hide();
}

function unbanUser(button) {
	const row = button.closest('tr');
	const userId = row.querySelector('td:first-child').textContent;
	if (!userId) {
		alert('无法获取用户ID，请刷新页面重试');
		return;
	}

	if (!confirm('确定要解封该用户吗？')) {
		return;
	}

	fetch('/admin/users/' + encodeURIComponent(userId) + '/unban', {
		method: 'POST'
	})
	.then(response => {
		if (!response.ok) {
			throw new Error('网络请求失败');
		}
		return response.text();
	})
	.then(result => {
		alert(result);
		if (result === '用户已解封') {
			location.reload();
		}
	})
	.catch(error => {
		console.error('Error:', error);
		alert('操作失败，请重试');
	});
}

function deleteUser(button) {
	const row = button.closest('tr');
	const userId = row.querySelector('td:first-child').textContent;
	if (!userId) {
		alert('无法获取用户ID，请刷新页面重试');
		return;
	}

	if (!confirm('确定要删除该用户吗？\n此操作不可恢复！\n删除后该用户的所有数据将被永久删除！')) {
		return;
	}

	fetch('/admin/users/' + encodeURIComponent(userId) + '/delete', {
		method: 'POST'
	})
	.then(response => response.text())
	.then(result => {
		alert(result);
		if (result === '用户已删除') {
			location.reload();
		}
	})
	.catch(error => {
		console.error('Error:', error);
		alert('操作失败，请重试');
	});
}

function updateUserRole(select) {
	const userId = select.getAttribute('data-user-id');
	const newRole = select.value;
	const originalRole = select.getAttribute('data-original-value');

	// 检查是否是管理员角色
	if (originalRole === 'ADMIN') {
		alert('不能修改管理员的角色');
		select.value = originalRole;
		return;
	}

	// 检查新角色是否合法
	if (newRole !== 'USER' && newRole !== 'MODERATOR') {
		alert('只能将用户角色设置为普通用户或版务');
		select.value = originalRole;
		return;
	}

	if (newRole === 'MODERATOR') {
		// 保存当前状态
		currentUserId = userId;
		currentUserRole = newRole;

		// 获取用户当前的版块权限
		fetch('/admin/users/' + encodeURIComponent(userId) + '/moderator-sections')
			.then(response => {
				if (!response.ok) {
					throw new Error('获取版块权限失败');
				}
				return response.json();
			})
			.then(sections => {
				// 清除所有复选框的选中状态
				document.querySelectorAll('.section-checkbox').forEach(checkbox => {
					checkbox.checked = false;
				});
				// 设置当前用户的版块权限
				sections.forEach(section => {
					const checkbox = document.querySelector('.section-checkbox[value="' +
						section.replace(/"/g, '\\"').replace(/&/g, '&amp;') + '"]');
					if (checkbox) {
						checkbox.checked = true;
					}
				});
				// 显示版块选择模态框
				if (sectionModal) {
					sectionModal.show();
				} else {
					alert('初始化模态框失败，请刷新页面重试');
					select.value = originalRole;
				}
			})
			.catch(error => {
				console.error('Error:', error);
				alert(error.message || '获取版块权限失败');
				select.value = originalRole;
			});
	} else {
		const confirmMessage = '确定要将该用户角色更改为' +
			(newRole === 'USER' ? '普通用户' : '版务') + '吗？';

		if (!confirm(confirmMessage)) {
			select.value = originalRole;
			return;
		}

		updateRole(userId, newRole, select);
	}
}

function updateRole(userId, newRole, select) {
	const formData = new URLSearchParams();
	formData.append('role', newRole);

	fetch('/admin/users/' + encodeURIComponent(userId) + '/update-role', {
		method: 'POST',
		headers: {
			'Content-Type': 'application/x-www-form-urlencoded',
		},
		body: formData.toString()
	})
	.then(response => {
		if (!response.ok) {
			throw new Error('网络请求失败');
		}
		return response.text();
	})
	.then(result => {
		alert(result);
		if (result === '角色更新成功') {
			location.reload();
		} else if (select) {
			select.value = select.getAttribute('data-original-value');
		}
	})
	.catch(error => {
		console.error('Error:', error);
		alert('操作失败，请重试');
		if (select) {
			select.value = select.getAttribute('data-original-value');
		}
	});
}

function toggleAllSections(checkbox) {
	const sections = document.querySelectorAll('.section-checkbox');
	sections.forEach(section => {
		section.checked = checkbox.checked;
	});
}

function saveModeratorSections() {
	if (!currentUserId) {
		alert('无法获取用户ID，请刷新页面重试');
		return;
	}

	const sections = document.querySelectorAll('.section-checkbox:checked');
	const selectedSections = Array.from(sections).map(checkbox => checkbox.value);

	if (selectedSections.length === 0) {
		alert('请至少选择一个版块');
		return;
	}

	const confirmMessage = '确定要将该用户设置为版务并分配以下版块吗？\n选中的版块：' +
		selectedSections.join('、');

	if (!confirm(confirmMessage)) {
		return;
	}

	// 先更新用户角色为版务
	const formData = new URLSearchParams();
	formData.append('role', 'MODERATOR');

	fetch('/admin/users/' + encodeURIComponent(currentUserId) + '/update-role', {
		method: 'POST',
		headers: {
			'Content-Type': 'application/x-www-form-urlencoded',
		},
		body: formData.toString()
	})
	.then(response => {
		if (!response.ok) {
			throw new Error('更新用户角色失败');
		}
		return response.text();
	})
	.then(result => {
		if (result === '角色更新成功') {
			// 角色更新成功后，更新版块权限
			const sectionData = new URLSearchParams();
			sectionData.append('sections', JSON.stringify(selectedSections));

			return fetch('/admin/users/' + encodeURIComponent(currentUserId) + '/moderator-sections', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/x-www-form-urlencoded',
				},
				body: sectionData.toString()
			});
		} else {
			throw new Error('更新用户角色失败');
		}
	})
	.then(response => {
		if (!response.ok) {
			throw new Error('更新版块权限失败');
		}
		return response.text();
	})
	.then(result => {
		alert(result);
		if (result === '版块权限更新成功') {
			location.reload();
		}
	})
	.catch(error => {
		console.error('Error:', error);
		alert(error.message || '操作失败，请重试');
	});

	if (sectionModal) {
		sectionModal.hide();
	}
}

function promoteToModerator(button) {
	const row = button.closest('tr');
	const userId = row.querySelector('td:first-child').textContent;
	if (!userId) {
		alert('无法获取用户ID，请刷新页面重试');
		return;
	}

	currentUserId = userId;
	currentUserRole = 'MODERATOR';

	// 获取用户当前的版块权限
	fetch('/admin/users/' + encodeURIComponent(userId) + '/moderator-sections')
		.then(response => {
			if (!response.ok) {
				throw new Error('获取版块权限失败');
			}
			return response.json();
		})
		.then(sections => {
			// 清除所有复选框的选中状态
			document.querySelectorAll('.section-checkbox').forEach(checkbox => {
				checkbox.checked = false;
			});
			// 设置当前用户的版块权限
			sections.forEach(section => {
				const checkbox = document.querySelector('.section-checkbox[value="' +
					section.replace(/"/g, '\\"').replace(/&/g, '&amp;') + '"]');
				if (checkbox) {
					checkbox.checked = true;
				}
			});
			// 显示版块选择模态框
			if (sectionModal) {
				sectionModal.show();
			} else {
				alert('初始化模态框失败，请刷新页面重试');
			}
		})
		.catch(error => {
			console.error('Error:', error);
			alert(error.message || '获取版块权限失败');
		});
}

function demoteToUser(button) {
	const row = button.closest('tr');
	const userId = row.querySelector('td:first-child').textContent;
	if (!userId) {
		alert('无法获取用户ID，请刷新页面重试');
		return;
	}

	if (!confirm('确定要将该用户降级为普通用户吗？\n该操作将移除用户的所有版块权限。')) {
		return;
	}

	// 先移除用户的所有版块权限
	fetch('/admin/users/' + encodeURIComponent(userId) + '/moderator-sections', {
		method: 'DELETE'
	})
	.then(response => {
		if (!response.ok) {
			throw new Error('移除版块权限失败');
		}
		return response.text();
	})
	.then(result => {
		if (result === '版块权限移除成功') {
			// 版块权限移除成功后，更新用户角色为普通用户
			const formData = new URLSearchParams();
			formData.append('role', 'USER');

			return fetch('/admin/users/' + encodeURIComponent(userId) + '/update-role', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/x-www-form-urlencoded',
				},
				body: formData.toString()
			});
		} else {
			throw new Error('移除版块权限失败');
		}
	})
	.then(response => {
		if (!response.ok) {
			throw new Error('更新用户角色失败');
		}
		return response.text();
	})
	.then(result => {
		alert(result);
		if (result === '角色更新成功') {
			location.reload();
		}
	})
	.catch(error => {
		console.error('Error:', error);
		alert(error.message || '操作失败，请重试');
	});
}

//]]>
</script>

<body>
	<main layout:fragment="content">
	<header class="page-header">
		<div class="container">
			<h1 class="page-title">
				<i class="material-icons">people</i>
				用户管理
			</h1>
		</div>
	</header>

	<article class="container">
		<div class="page-content">
			<div class="row">
				<div class="col s12">
					<div th:if="${error}" class="error-message">
						<p th:text="${error}">错误信息</p>
					</div>
					<table class="user-table" th:if="${users != null and not #lists.isEmpty(users)}">
						<thead>
							<tr>
								<th>ID</th>
								<th>用户名</th>
								<th>邮箱</th>
								<th>角色</th>
								<th>状态</th>
								<th>注册时间</th>
								<th>操作</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="user : ${users}" th:class="${user.banned ? 'banned' : ''}" th:data-user-id="${user.id}">
								<td th:text="${user.id}">ID</td>
								<td th:text="${user.username}">用户名</td>
								<td th:text="${user.email}">邮箱</td>
								<td>
									<span th:if="${user.role == 'ADMIN'}" class="status-badge status-admin">管理员</span>
									<span th:if="${user.role == 'MODERATOR'}" class="status-badge status-moderator">版务</span>
									<span th:if="${user.role == 'USER'}" class="status-badge status-user">普通用户</span>
								</td>
								<td>
									<span th:class="${user.banned ? 'status-badge status-banned' : 'status-badge status-normal'}">
										<i class="material-icons status-icon" th:text="${user.banned ? 'block' : 'check_circle'}"></i>
										<span th:text="${user.banned ? '已封禁' : '正常'}"></span>
									</span>
								</td>
								<td th:text="${user.displayParsedDate()}">注册时间</td>
								<td>
									<!-- 升级按钮：普通用户可升级为版务 -->
									<button class="btn btn-primary btn-sm action-btn" title="提升为版务"
											th:if="${user.role == 'USER'}"
											th:data-user-id="${user.id}"
											onclick="promoteToModerator(this)">
										<i class="material-icons">arrow_upward</i>
									</button>

									<!-- 降级按钮：版务可降级为普通用户 -->
									<button class="btn btn-warning btn-sm action-btn" title="降级为普通用户"
											th:if="${user.role == 'MODERATOR'}"
											th:data-user-id="${user.id}"
											onclick="demoteToUser(this)">
										<i class="material-icons">arrow_downward</i>
									</button>

									<button class="btn btn-danger btn-sm action-btn" title="封禁用户"
											th:if="${user.role != 'ADMIN'}"
											th:data-user-id="${user.id}"
											data-action="ban">
										<i class="material-icons">block</i>
									</button>
									<button class="btn btn-success btn-sm action-btn" title="解除封禁"
											th:if="${user.banned}"
											th:data-user-id="${user.id}"
											data-action="unban">
										<i class="material-icons">check_circle</i>
									</button>
									<button class="btn btn-danger btn-sm action-btn" title="删除用户"
											th:if="${user.role != 'ADMIN'}"
											th:data-user-id="${user.id}"
											data-action="delete">
										<i class="material-icons">delete</i>
									</button>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</article>

	<!-- 封禁用户模态框 -->
	<div class="modal fade" id="banModal" tabindex="-1" role="dialog" aria-labelledby="banModalLabel" aria-modal="true">
		<div class="modal-dialog" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="banModalLabel">封禁用户</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
				</div>
				<div class="modal-body">
					<div class="mb-3">
						<label for="banDuration" class="form-label">封禁时长（天）</label>
						<input type="number" class="form-control" id="banDuration" min="1" value="7" aria-describedby="banDurationHelp" />
						<div class="form-text" id="banDurationHelp">输入0表示永久封禁</div>
					</div>
					<div class="mb-3">
						<label for="banReason" class="form-label">封禁原因</label>
						<textarea class="form-control" id="banReason" rows="3" required="required" aria-required="true"></textarea>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
					<button type="button" class="btn btn-danger" onclick="confirmBan()">确认封禁</button>
				</div>
			</div>
		</div>
	</div>

	<!-- 版块选择模态框 -->
	<div class="modal fade" id="sectionModal" tabindex="-1" role="dialog" aria-labelledby="sectionModalLabel" aria-modal="true">
		<div class="modal-dialog" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="sectionModalLabel">选择负责版块</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
				</div>
				<div class="modal-body">
					<div class="form-check">
						<input class="form-check-input" type="checkbox" id="allSections" onchange="toggleAllSections(this)" />
						<label class="form-check-label" for="allSections">全部版块</label>
					</div>
					<div class="form-check">
						<input class="form-check-input section-checkbox" type="checkbox" value="校园新闻" id="news" />
						<label class="form-check-label" for="news">校园新闻</label>
					</div>
					<div class="form-check">
						<input class="form-check-input section-checkbox" type="checkbox" value="学习交流" id="study" />
						<label class="form-check-label" for="study">学习交流</label>
					</div>
					<div class="form-check">
						<input class="form-check-input section-checkbox" type="checkbox" value="校园生活" id="life" />
						<label class="form-check-label" for="life">校园生活</label>
					</div>
					<div class="form-check">
						<input class="form-check-input section-checkbox" type="checkbox" value="社团活动" id="club" />
						<label class="form-check-label" for="club">社团活动</label>
					</div>
					<div class="form-check">
						<input class="form-check-input section-checkbox" type="checkbox" value="失物招领" id="lost" />
						<label class="form-check-label" for="lost">失物招领</label>
					</div>
					<div class="form-check">
						<input class="form-check-input section-checkbox" type="checkbox" value="其他" id="other" />
						<label class="form-check-label" for="other">其他</label>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
					<button type="button" class="btn btn-primary" onclick="saveModeratorSections()">保存</button>
				</div>
			</div>
		</div>
	</div>
	</main>
</body>
</html>
