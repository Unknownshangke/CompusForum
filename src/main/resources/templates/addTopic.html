<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="layout/online">
<head>
    <title>Add Topic</title>
</head>
<body>
    <main layout:fragment="content">
        <article class="container" style="padding: 3% 0 2%;">
            <header class="row">
                <div class="col s12">
                    <blockquote class="flow-text left" th:text="|选择一个目录并创建相应的话题： |">Add topic</blockquote>
                </div>
            </header>
            <section>
                <form th:action="@{/addTopic}" method="post">
                    <div class="row">
                        <div class="col s12">
                            <p>
                                <input value="news" name="category" class="with-gap" type="radio" id="news" required="required"/>
                                <label for="news">校园新闻</label>
                            </p>
                            <p>
                                <input value="study" name="category" class="with-gap" type="radio" id="study" required="required"/>
                                <label for="study">学习交流</label>
                            </p>
                            <p>
                                <input value="life" name="category" class="with-gap" type="radio" id="life" required="required"/>
                                <label for="life">校园生活</label>
                            </p>
                            <p>
                                <input value="club" name="category" class="with-gap" type="radio" id="club" required="required"/>
                                <label for="club">社团活动</label>
                            </p>
                            <p>
                                <input value="lost" name="category" class="with-gap" type="radio" id="lost" required="required"/>
                                <label for="lost">失物招领</label>
                            </p>
                            <p>
                            		<input value="other" name="category" class="with-gap" type="radio" id="other" required="required"/>
                                <label for="other">其他</label>
                            </p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col s12">
                            <label>Title:
                                <input type="text" name="title" maxlength="32" data-length="32" required="required"/>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col s12">
                            <label>Content:
                            		<textarea name="content" class="materialize-textarea" maxlength="1024" data-length="1024" required="required"></textarea>
                            </label>
                        </div>
                    </div>

				<div class="row">
                        <div class="col s12">
                            <label>Code:
                                <textarea name="code" class="materialize-textarea" placeholder="[optional]"
                                          style="font-family: monospace, monospace;" maxlength="1024" data-length="1024"></textarea>
                            </label>
                        </div>
                    </div>
                    <input type="hidden" name="id_user" th:value="${user.getId()}"/>
                    <div class="row">
                        <div class="col s12 center">
                            <button class="btn waves-effect waves-light btn-large" type="submit" name="add">发表</button>
                        </div>
                    </div>
                </form>
            </section>
        </article>
    </main>
</body>
</html>
